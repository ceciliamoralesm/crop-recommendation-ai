services:
  db:
    image: postgres:16-alpine
    container_name: crop_ai_db
    environment:
      POSTGRES_USER: crop
      POSTGRES_PASSWORD: crop
      POSTGRES_DB: crop_ai
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crop -d crop_ai"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
